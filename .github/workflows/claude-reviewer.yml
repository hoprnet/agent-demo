# The review agent. Runs on every push to a pull request that carries the `claude-loop` label, and once when
# the label is added. It reads the new commits, runs the tests, checks the coder's claims, and submits ONE
# pull request review marked `[reviewer]`: "request changes" with a numbered list, or "approve". It never
# edits or pushes. A "request changes" review triggers the coder; an approval ends the loop.
name: claude-reviewer

on:
  pull_request:
    types: [synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number
        required: true

jobs:
  reviewer:
    concurrency:
      group: claude-reviewer-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'claude-loop') && (github.event.action == 'synchronize' || github.event.label.name == 'claude-loop'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      MAX_ROUNDS: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out the PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout "$PR"

      - name: Install the test tooling
        run: python3 -m pip install --quiet --disable-pip-version-check pytest

      - name: Count reviewer rounds
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate \
                --jq '[.[] | select(.state == "CHANGES_REQUESTED") | select(.body | startswith("[reviewer]"))] | length')
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Run the review agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's default bot_id (41898282) is github-actions[bot]'s user ID, so commits it makes are attributed
          # to that account and GitHub holds the workflow runs they trigger for manual approval ("action_required").
          # 209825114 is the Claude GitHub App's own bot user, claude[bot]; with it, the coder's pushes trigger the
          # reviewer like any other push.
          bot_id: "209825114"
          bot_name: "claude[bot]"
          allowed_bots: "claude[bot]"
          prompt: |
            You are the review agent for pull request #${{ env.PR }} in ${{ github.repository }}. The checked-out tree is
            the PR head. Read AGENTS.md first and follow it. Then:
            1. Read what changed since the last `[reviewer]` review (`gh pr view ${{ env.PR }} --comments`, `git log`,
               `gh pr diff ${{ env.PR }}`), and every `[coder]` comment since then.
            2. Verify, do not trust: run `python -m pytest -q`; read the changed code; check each claim in the `[coder]`
               comments against the diff and the test output.
            3. Submit exactly one review with `gh pr review ${{ env.PR }}`:
               - `--request-changes --body "..."` when anything must change. The body starts with `[reviewer]`, then a
                 numbered list; every item names file and line, says what is wrong and what would satisfy you.
               - `--approve --body "[reviewer] ..."` when the tests pass and nothing remains; say what you verified.
               - Reviewer rounds so far: ${{ steps.rounds.outputs.n }} of ${{ env.MAX_ROUNDS }}. At the cap, use
                 `--comment` instead of `--request-changes` and say a human must decide; this ends the loop.
            Never edit files, never commit, never push. Never approve while a test fails.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(python -m pytest:*),Bash(python3 -m pytest:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh api repos/*/pulls/*/comments),Bash(gh api repos/*/pulls/*/reviews)"
            --max-turns 80
