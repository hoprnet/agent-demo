# The review agent. Runs when the `claude-loop` label is added, on every human push to a labelled pull request,
# by hand (workflow_dispatch), and through workflow_call as the second job of the coder's run right after the
# coder pushed. It runs the tests, checks the coder's claims, and submits ONE review marked `[reviewer]`:
# "request changes" with a numbered list, or "approve". It never edits or pushes. A "request changes" review
# triggers the coder; an approval ends the loop. The `claude-loop` commit status on the PR head follows it:
# pending while it works or while changes are open, green on approval, red on failure or at the round cap.
name: claude-reviewer

on:
  pull_request:
    types: [synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number
        required: true
      force:
        description: review even if this head was already reviewed
        type: boolean
        default: true
  workflow_call:
    inputs:
      pr:
        description: pull request number
        required: true
        type: string

env:
  MAX_ROUNDS: 5

jobs:
  reviewer:
    # a newer push cancels a review in progress: only the latest head is worth reviewing
    concurrency:
      group: claude-reviewer-${{ inputs.pr || github.event.pull_request.number }}
      cancel-in-progress: true
    # inputs.pr is set by workflow_dispatch and by the coder's workflow_call; pull_request events need the label
    if: inputs.pr != '' || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && contains(github.event.pull_request.labels.*.name, 'claude-loop') && (github.event.action == 'synchronize' || github.event.label.name == 'claude-loop'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: write
      statuses: write
    outputs:
      diag_headline: ${{ steps.diag.outputs.headline }}
      diag_hint: ${{ steps.diag.outputs.hint }}
      diag_lines: ${{ steps.diag.outputs.lines }}
    env:
      PR: ${{ inputs.pr || github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out the PR head
        id: head
        run: |
          cp .github/claude-loop/loop.sh "$RUNNER_TEMP/loop.sh"
          timeout 120 gh pr checkout "$PR"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Already reviewed?
        id: pre
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e; "$RUNNER_TEMP/loop.sh" reviewer-precheck "$PR" "${{ steps.head.outputs.sha }}"; rc=$?; set -e
          if [ "$rc" -eq 10 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$rc" -eq 0 ] || { echo "loop: FAIL precheck could not read the pull request (rc $rc)"; exit 1; }
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Rounds and status
        id: rounds
        if: steps.pre.outputs.run == 'true'
        run: |
          n=$("$RUNNER_TEMP/loop.sh" rounds "$PR")
          echo "n=$n" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/loop.sh" status "$PR" pending "reviewer checking ${{ steps.head.outputs.sha }}" "${{ steps.head.outputs.sha }}"

      - name: Install the test tooling
        if: steps.pre.outputs.run == 'true'
        run: timeout 300 python3 -m pip install --quiet --disable-pip-version-check pytest

      - name: Run the review agent
        id: agent
        if: steps.pre.outputs.run == 'true'
        timeout-minutes: 18
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          bot_id: "209825114"
          bot_name: "claude[bot]"
          allowed_bots: "claude[bot]"
          prompt: |
            You are the review agent for pull request #${{ env.PR }} in ${{ github.repository }}. The checked-out tree is
            the PR head ${{ steps.head.outputs.sha }}. Read AGENTS.md first and follow it. Then:
            1. Read what changed since the last `[reviewer]` review (`gh pr view ${{ env.PR }} --comments`, `git log`,
               `gh pr diff ${{ env.PR }}`), every `[coder]` comment since then, and every human comment and inline
               comment, so you know what was asked.
            2. Verify, do not trust: run `python -m pytest -q`; read the changed code; check each claim in the `[coder]`
               comments against the diff and the test output; check that each human request the coder answered was
               either done or answered with a reason. Human requests with no `[coder]` answer yet are the coder's
               work in progress (it is triggered separately and may be running now): do not turn them into numbered
               items and do not request changes because of them alone; name them in one line under
               "Not yet answered by the coder:".
            3. Submit exactly one review with `gh pr review ${{ env.PR }}`:
               - `--request-changes --body "..."` when anything the coder can change must change. The body starts with
                 `[reviewer]`, then a numbered list; every item names file and line, says what is wrong and what would
                 satisfy you. Anything only a human can do (the PR title or description, closing the PR, a design
                 decision between acceptable options) goes after the list under `For a human:` and never on its own
                 makes the review a request-changes.
               - `--approve --body "[reviewer] ..."` when the tests pass and nothing the coder can change remains; say
                 what you verified, and keep the `For a human:` note if there is one.
               - When a team member's instruction contradicts an argument made earlier in the thread, say so in one
                 sentence, then judge the code against the instruction.
               - Reviewer rounds so far: ${{ steps.rounds.outputs.n }} of ${{ env.MAX_ROUNDS }}. At the cap, use
                 `--comment` instead of `--request-changes` and say a human must decide; this ends the loop.
            Never edit files, never commit, never push. Never approve while a test fails.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(python -m pytest:*),Bash(python3 -m pytest:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh api repos/*/pulls/*/comments),Bash(gh api repos/*/pulls/*/reviews)"
            --model claude-opus-5-5
            --max-turns 80

      - name: Run summary (turns, time, refused tool calls)
        if: always() && steps.agent.outcome != 'skipped' && steps.agent.outcome != ''
        run: '"$RUNNER_TEMP/loop.sh" summary "${{ steps.agent.outputs.execution_file }}" reviewer || true'

      - name: Postcondition and status
        id: post
        if: steps.pre.outputs.run == 'true'
        run: |
          st=$("$RUNNER_TEMP/loop.sh" reviewer-state "$PR" "${{ steps.head.outputs.start }}")
          if [ -z "$st" ]; then echo "loop: FAIL the reviewer produced no [reviewer] review in this run (postcondition)"; exit 1; fi
          echo "review state: $st"
          "$RUNNER_TEMP/loop.sh" after-review "$PR" "$st" "${{ steps.rounds.outputs.n }}" "$MAX_ROUNDS" "${{ steps.head.outputs.sha }}"

      - name: Diagnose a failure
        id: diag
        if: failure()
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "${{ steps.pre.outcome }}" = failure ]; then s=precheck
          elif [ "${{ steps.agent.outcome }}" = failure ]; then s=agent
          elif [ "${{ steps.post.outcome }}" = failure ]; then s=postcondition
          else s=other; fi
          "$RUNNER_TEMP/loop.sh" diagnose "$s" "${{ steps.agent.outputs.execution_file }}" "${{ steps.head.outputs.start }}" 18

      - name: Cancel held duplicate runs
        # a coder push also fires a pull_request run that GitHub holds for approval; this review already covers it
        if: always() && steps.head.outcome == 'success'
        run: '"$RUNNER_TEMP/loop.sh" cancel-held || true'

  # Make a failure visible on the PR. A review cancelled by a newer push is expected and not reported.
  report:
    needs: reviewer
    if: always() && needs.reviewer.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      DIAG_HEADLINE: ${{ needs.reviewer.outputs.diag_headline }}
      DIAG_HINT: ${{ needs.reviewer.outputs.diag_hint }}
      DIAG_LINES: ${{ needs.reviewer.outputs.diag_lines }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/claude-loop
      - run: .github/claude-loop/loop.sh report "${{ inputs.pr || github.event.pull_request.number }}" reviewer
