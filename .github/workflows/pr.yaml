name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true

jobs:
  # Keeps the `Merge gate` check name present in every repository so the
  # ruleset can require it uniformly (hoprnet/hopr-devops#372). It grows
  # a `needs:` list when the repository gets real PR jobs. The claude-*
  # workflows are label-driven agent runs, not PR checks: they fire on
  # `labeled` or `synchronize` only, never on `opened`, and the VPN test
  # shares a global concurrency group, so the gate lives here.
  merge-gate:
    name: Merge gate
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # alls-green rejects an empty `needs`; swap it back in when the first
      # real PR job joins `needs:`.
      - run: echo "no PR checks in this repository"
