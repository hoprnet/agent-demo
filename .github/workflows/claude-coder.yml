# The coding agent. Runs when something lands on a pull request that carries the `claude-loop` label: a human
# comment, a human inline review comment, or a submitted review from a human, from Copilot, or from the reviewer
# agent (marked `[reviewer]`). It fixes code on the PR branch, pushes, and replies with a `[coder]` comment.
# The label event itself starts only the reviewer; its first review pulls the coder in.
#
# Jobs: `coder` (precheck without Claude, then the agent), `review` (the reviewer workflow, called only when the
# coder pushed: a push made from inside a workflow cannot wake another workflow, GitHub holds such runs for
# approval), `report` (on failure: a visible `[loop]` comment, a red `claude-loop` status and the
# `claude-loop:error` label). The shared logic lives in .github/claude-loop/loop.sh. See README.md and AGENTS.md.
name: claude-coder

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # by hand from the Actions tab, and by the reviewer when it approves while human requests are still open
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number
        required: true

env:
  MAX_ROUNDS: 0

jobs:
  coder:
    # Concurrency on the job, not the workflow: GitHub keeps one queued run per group, and a workflow-level group
    # would let runs the `if:` below skips (other bots' comments, the coder's own reply) cancel the queued run that
    # matters. A job the `if:` skips never enters the group. A queued run that a newer one replaces is harmless:
    # every run reads all open requests, and the report job ignores runs that never started.
    concurrency:
      group: claude-coder-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
    # The gate, evaluated before a runner starts. Every branch needs an open PR with the label. Human events count only from
    # owners, organisation members and collaborators. Bot events pass only for the reviewer agent's review
    # (`[reviewer]` at the start of the body, not an approval) and Copilot's review; the coder's own `[coder]`
    # posts never re-trigger it, and inline comments count only from humans (Copilot's review fires once).
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'claude-loop')
        && !startsWith(github.event.comment.body, '[coder]')
        && ((!endsWith(github.actor, '[bot]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
            || startsWith(github.event.comment.body, '[reviewer]'))) ||
      (github.event_name == 'pull_request_review_comment' && github.event.pull_request.state == 'open' && contains(github.event.pull_request.labels.*.name, 'claude-loop')
        && !endsWith(github.actor, '[bot]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open' && contains(github.event.pull_request.labels.*.name, 'claude-loop')
        && github.event.review.state != 'approved'
        && !startsWith(github.event.review.body, '[coder]')
        && ((!endsWith(github.actor, '[bot]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
            || startsWith(github.event.review.body, '[reviewer]') || github.actor == 'copilot-pull-request-reviewer[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      statuses: write
    outputs:
      pushed: ${{ steps.pushed.outputs.pushed }}
      diag_headline: ${{ steps.diag.outputs.headline }}
      diag_hint: ${{ steps.diag.outputs.hint }}
      diag_lines: ${{ steps.diag.outputs.lines }}
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out the PR branch
        id: head
        run: |
          # the helper script from the default branch, explicitly: pull_request events check out the PR's merge
          # ref, which GitHub may have computed before the latest change to main, and a PR must not change the
          # loop's own logic. /tmp/claude-loop/loop.sh is the path the coder may call for thread replies.
          git show "origin/${{ github.event.repository.default_branch }}:.github/claude-loop/loop.sh" > "$RUNNER_TEMP/loop.sh"
          chmod +x "$RUNNER_TEMP/loop.sh"
          mkdir -p /tmp/claude-loop && cp "$RUNNER_TEMP/loop.sh" /tmp/claude-loop/loop.sh
          timeout 120 gh pr checkout "$PR"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$(git branch --show-current)" >> "$GITHUB_OUTPUT"
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Anything new for the coder?
        id: pre
        run: |
          set +e
          reqs=$("$RUNNER_TEMP/loop.sh" coder-precheck "$PR"); rc=$?
          set -e
          if [ "$rc" -eq 10 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$rc" -eq 0 ] || { echo "loop: FAIL precheck could not read the pull request (rc $rc)"; exit 1; }
          echo "run=true" >> "$GITHUB_OUTPUT"
          { echo "requests<<EOF_REQ"; echo "$reqs"; echo "EOF_REQ"; } >> "$GITHUB_OUTPUT"
          echo "$reqs"

      - name: Acknowledge
        # 👀 on every comment this run will handle, not only the one that triggered it: a burst of comments is
        # coalesced into one run, and each author should see theirs was picked up
        if: steps.pre.outputs.run == 'true'
        env:
          REQUESTS: ${{ steps.pre.outputs.requests }}
        run: |
          jq -r 'select(.kind == "comment") | .id' <<<"$REQUESTS" | while read -r id; do "$RUNNER_TEMP/loop.sh" ack issue_comment "$id"; done
          jq -r 'select(.kind == "inline") | .id' <<<"$REQUESTS" | while read -r id; do "$RUNNER_TEMP/loop.sh" ack pull_request_review_comment "$id"; done

      - name: Round cap
        id: rounds
        if: steps.pre.outputs.run == 'true'
        run: |
          n=$("$RUNNER_TEMP/loop.sh" rounds "$PR")
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "reviewer rounds since the label: $n of $MAX_ROUNDS"
          # the coder works on up to MAX_ROUNDS change requests; at the cap the reviewer comments instead of
          # requesting changes, so this guard only fires if more change requests than that arrive anyway
          if [ "$n" -gt "$MAX_ROUNDS" ]; then
            "$RUNNER_TEMP/loop.sh" cap "$PR" "$n" "$MAX_ROUNDS"
            echo "capped=true" >> "$GITHUB_OUTPUT"
          else
            echo "capped=false" >> "$GITHUB_OUTPUT"
            "$RUNNER_TEMP/loop.sh" status "$PR" pending "coder working (${{ github.event_name }} by ${{ github.actor }})" "${{ steps.head.outputs.sha }}"
            echo "agent_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the test tooling
        if: steps.rounds.outputs.capped == 'false'
        # ubuntu-latest ships python3 but not pytest; without it the agents can only trace tests by hand
        run: timeout 300 python3 -m pip install --quiet --disable-pip-version-check pytest

      - name: Run the coding agent
        id: agent
        if: steps.rounds.outputs.capped == 'false'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 209825114 is the Claude GitHub App's bot user, claude[bot]; the action's default (41898282) is
          # github-actions[bot], which would attribute the coder's commits to that account.
          bot_id: "209825114"
          bot_name: "claude[bot]"
          # github-actions[bot] is the actor of a dispatch by the reviewer workflow
          allowed_bots: "claude[bot],copilot-pull-request-reviewer[bot],github-actions[bot]"
          prompt: |
            You are the coding agent for pull request #${{ env.PR }} in ${{ github.repository }}, branch
            `${{ steps.head.outputs.branch }}` (checked out). Event: ${{ github.event_name }} by ${{ github.actor }}.
            Read AGENTS.md first and follow it.

            Open requests the workflow found (one JSON object per line; kind comment, inline or review; id; time):
            ${{ steps.pre.outputs.requests }}

            1. Read the pull request (`gh pr view ${{ env.PR }} --comments`, `gh pr diff ${{ env.PR }}`) and the review
               threads (`gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/comments`, `.../reviews`). Handle every
               open request above, and any other request without a `[coder]` answer. A `[reviewer]` review is a numbered
               list; each item is a request. Ignore "For a human:" notes; they are not for you.
            2. For each request: change the code, or answer with a reason. A team member's instruction settles a design
               question; when it contradicts an argument made earlier in the thread, say so in one sentence, then do it.
               Run `python -m pytest -q` before committing; commit with a message naming the request.
            3. Push with `git push origin HEAD`. If the push is rejected because the branch moved, run
               `git pull --rebase origin ${{ steps.head.outputs.branch }}`, run the tests again, and push again. If the
               rebase conflicts, run `git rebase --abort` and say so in your comment instead of forcing anything.
            4. For each inline request (kind inline), reply in its thread with exactly this command (one call per
               comment, body in single quotes): `/tmp/claude-loop/loop.sh reply ${{ env.PR }} <comment id> '<short answer>'`
            5. Post exactly one summary with `gh pr comment ${{ env.PR }} --body "..."`. It must start with `[coder]`, name
               the commit hash (or say no commit), list each request with what was done or why not, and end with this
               exact last line: <!-- seen-until: ${{ steps.head.outputs.start }} -->
            If nothing needs a change, still post the summary saying so and why.
            Never edit .github/ or AGENTS.md. Never force-push. Never approve, review, retitle or close the PR.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(python -m pytest:*),Bash(python3 -m pytest:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD),Bash(git fetch:*),Bash(git pull --rebase:*),Bash(git rebase:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/*/pulls/*/comments),Bash(gh api repos/*/pulls/*/reviews),Bash(/tmp/claude-loop/loop.sh reply:*)"
            --model claude-opus-5-5
            --max-turns 80

      - name: Run summary (turns, time, refused tool calls)
        if: always() && steps.agent.outcome != 'skipped' && steps.agent.outcome != ''
        run: '"$RUNNER_TEMP/loop.sh" summary "${{ steps.agent.outputs.execution_file }}" coder || true'

      - name: Postcondition, the coder replied
        id: post
        if: steps.rounds.outputs.capped == 'false'
        run: |
          if "$RUNNER_TEMP/loop.sh" coder-posted "$PR" "${{ steps.head.outputs.start }}"; then echo "coder replied"; "$RUNNER_TEMP/loop.sh" clear-error "$PR"; else
            echo "loop: FAIL the coder did not post its [coder] reply in this run (postcondition)"; exit 1; fi

      - name: Diagnose a failure
        id: diag
        if: failure()
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${{ steps.pre.outcome }}" = failure ]; then s=precheck
          elif [ "${{ steps.agent.outcome }}" = failure ]; then s=agent
          elif [ "${{ steps.post.outcome }}" = failure ]; then s=postcondition
          else s=other; fi
          "$RUNNER_TEMP/loop.sh" diagnose "$s" "${{ steps.agent.outputs.execution_file }}" "${{ steps.rounds.outputs.agent_start }}" 30

      - name: Did the coder push?
        id: pushed
        if: always() && steps.head.outcome == 'success'
        run: |
          timeout 120 git fetch -q origin "${{ steps.head.outputs.branch }}"
          now=$(git rev-parse "origin/${{ steps.head.outputs.branch }}")
          if [ "$now" != "${{ steps.head.outputs.sha }}" ]; then echo "pushed=true" >> "$GITHUB_OUTPUT"; echo "new head $now"
          else echo "pushed=false" >> "$GITHUB_OUTPUT"; echo "no push"; fi

      - name: Settle the status
        if: success() && steps.pre.outputs.run == 'true' && steps.rounds.outputs.capped == 'false' && steps.pushed.outputs.pushed == 'false'
        run: '"$RUNNER_TEMP/loop.sh" settle "$PR"'

  # The reviewer, as the second job of this run, whenever the branch moved (even if the coder then failed).
  review:
    needs: coder
    if: always() && needs.coder.outputs.pushed == 'true'
    uses: ./.github/workflows/claude-reviewer.yml
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) }}
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: write
      statuses: write

  # Make a failure visible on the PR. A queued run that a newer one replaced never started and is not reported.
  report:
    needs: coder
    if: always() && (needs.coder.result == 'failure' || needs.coder.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      DIAG_HEADLINE: ${{ needs.coder.outputs.diag_headline }}
      DIAG_HINT: ${{ needs.coder.outputs.diag_hint }}
      DIAG_LINES: ${{ needs.coder.outputs.diag_lines }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/claude-loop
      - run: .github/claude-loop/loop.sh report "${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}" coder
